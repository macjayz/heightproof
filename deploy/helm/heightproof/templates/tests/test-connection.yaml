apiVersion: v1
kind: Pod
metadata:
  name: {{ include "heightproof.fullname" . }}-test
  labels:
    {{- include "heightproof.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -ec
        - |
          api=http://{{ include "heightproof.fullname" . }}-api:{{ .Values.api.service.port }}
          wget -qO- "$api/health"
          wget -qO- "$api/ready" | tee /dev/stderr | grep -q '"status":"ready"'
          wget -qO- "$api/health/pipeline"
          {{- if .Values.dashboard.enabled }}
          dash=http://{{ include "heightproof.fullname" . }}-dashboard:{{ .Values.dashboard.service.port }}
          wget -qO- "$dash/healthz"
          wget -qO- "$dash/" | grep -qi '<div id="root"'
          # The dashboard's nginx must proxy API routes to the API service.
          wget -qO- "$dash/health"
          {{- end }}
          echo "smoke test passed"
