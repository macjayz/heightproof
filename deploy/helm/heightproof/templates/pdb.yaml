{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "heightproof.fullname" . }}-api
  labels:
    {{- include "heightproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "heightproof.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
{{- end }}
