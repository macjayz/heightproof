{{- $c := dict "ctx" $ "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heightproof.fullname" . }}-api
  labels:
    {{- include "heightproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "heightproof.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heightproof.selectorLabels" $c | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/migrations: {{ include (print $.Template.BasePath "/configmap-migrations.yaml") . | sha256sum }}
        {{- if .Values.api.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ include "heightproof.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "heightproof.migrateInitContainer" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "heightproof.image" $c }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            {{- include "heightproof.sharedEnv" . | nindent 12 }}
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: HEIGHTPROOF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "heightproof.secretName" . }}
                  key: heightproof-api-key
            - name: HEIGHTPROOF_ADMIN_EMAIL
              value: {{ .Values.auth.adminEmail | quote }}
            - name: HEIGHTPROOF_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "heightproof.secretName" . }}
                  key: admin-password
            - name: HEIGHTPROOF_ALLOW_DEV_FALLBACK_KEY
              value: {{ .Values.demo.allowDevFallbackKey | quote }}
            - name: HEIGHTPROOF_BOOTSTRAP_DEMO_USER
              value: {{ .Values.demo.bootstrapUser | quote }}
            - name: HEIGHTPROOF_SEED_DEMO_EVENTS
              value: {{ .Values.demo.seedEvents | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /health: the process is up (startup, liveness). /ready: it can serve, i.e. Postgres and
          # Redis are reachable; it answers 503 otherwise, so traffic stops reaching a pod that would
          # only return errors. /ready ignores the worker's backlog on purpose (see
          # /health/pipeline), so a slow worker never takes API pods out of rotation.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Let endpoint removal propagate before Node exits on SIGTERM.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "heightproof.tmpVolume" . | nindent 8 }}
        {{- include "heightproof.migrationsVolume" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "heightproof.fullname" . }}-api
  labels:
    {{- include "heightproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "heightproof.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
