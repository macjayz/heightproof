{{- if not .Values.auth.existingSecret }}
{{- $pgPassword := include "heightproof.secretValue" (dict "ctx" $ "key" "postgres-password" "value" .Values.postgresql.password) }}
{{- $databaseUrl := .Values.externalDatabase.url }}
{{- if .Values.postgresql.enabled }}
{{- $databaseUrl = printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.username $pgPassword (include "heightproof.postgresHost" .) .Values.postgresql.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heightproof.fullname" . }}
  labels:
    {{- include "heightproof.labels" . | nindent 4 }}
type: Opaque
stringData:
  heightproof-api-key: {{ include "heightproof.secretValue" (dict "ctx" $ "key" "heightproof-api-key" "value" .Values.auth.apiKey) | quote }}
  admin-password: {{ include "heightproof.secretValue" (dict "ctx" $ "key" "admin-password" "value" .Values.auth.adminPassword) | quote }}
  postgres-password: {{ $pgPassword | quote }}
  database-url: {{ required "externalDatabase.url is required when postgresql.enabled=false" $databaseUrl | quote }}
{{- end }}
